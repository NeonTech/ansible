# Version
fluxcord_git_url: https://git.gay/Fluxcord/core.git
fluxcord_git_version: 51a478af319fa78598f338d0d31c77db830f51e7

# User
fluxcord_user_name: "{{ ansible_user_id }}"
fluxcord_user_id: "{{ ansible_user_uid }}"
fluxcord_group_name: "{{ fluxcord_user_name }}"
fluxcord_group_id: "{{ fluxcord_user_id }}"

# Global
fluxcord_sqlite_encryption_token: ""
fluxcord_postgresql_connection: ""
fluxcord_admin_account_ids: []
fluxcord_automatic_bio: true
fluxcord_embed_footer_content: ""
fluxcord_typing_indicator: true
fluxcord_bot_prefix: "fc!"
fluxcord_voice_bridging: false

# Runner
fluxcord_runner_ws_port: 8765
fluxcord_runner_secret: ""

# Healthcheck
fluxcord_healthcheck: true
fluxcord_healthcheck_host: "0.0.0.0"
fluxcord_healthcheck_port: 8080
fluxcord_healthcheck_token: ""

# Fluxer
fluxcord_fluxer_api_base_url: https://fluxer.com/api
fluxcord_fluxer_bot_token: "{{ mandatory(msg='default secret') }}"
fluxcord_fluxer_emoji_guild_id: "{{ mandatory(msg='default value') }}"
fluxcord_fluxer_bio_start: ""

# Discord
fluxcord_discord_bot_token: "{{ mandatory(msg='default secret') }}"
fluxcord_discord_voice_tokens: []
fluxcord_discord_client_id: "{{ mandatory(msg='default value') }}"
fluxcord_discord_bio_start: ""
